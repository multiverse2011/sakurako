  "/api/channels/{type}/{channel}/stream":
    "get":
      "description": "Whole-transponder MPEG-TS from the preferred backend for this channel. Channel names follow channel_names (virtual by default, upstream for Mirakurun-compatible clients). With upstream names, configured priority (not health or freshness) picks the broadcast for a shared name, and only sources with the same service domain fail over. Sources that disagree on networkId are different broadcasts: the winner is chosen including stale catalogs, and only fresh sources with the winner's networkId are served, so an unavailable winner never switches to another broadcast. When choosing a source to start the stream, sources that are healthy and outside their stream cooldown are used; if there is no such source, sources that are healthy but cooling down as a whole backend are tried. A service or channel cooldown from a tuner shortage is still respected. Sharing otherwise matches service streams; priority does not split groups and decode=0 may join a decoded stream."
      "parameters":
        -
          "description": "Broadcast type: GR, BS, CS or SKY"
          "in": "path"
          "name": "type"
          "required": true
          "schema":
            "type": "string"
        -
          "description": "Channel name as returned by /api/channels"
          "in": "path"
          "name": "channel"
          "required": true
          "schema":
            "type": "string"
        -
          "description": "Forwarded to Mirakurun; one value only."
          "in": "query"
          "name": "decode"
          "schema":
            "enum":
              - "0"
              - "1"
            "type": "string"
        -
          "description": "Tuner allocation priority; distinct from backend source priority."
          "in": "header"
          "name": "X-Mirakurun-Priority"
          "schema":
            "maximum": 2147483647
            "minimum": 0
            "type": "integer"
      "responses":
        "200":
          "content":
            "video/MP2T":
              "schema":
                "format": "binary"
                "type": "string"
          "description": "Live transport stream; continues until disconnected."
          "headers":
            "X-Mirakurun-Tuner-User-ID":
              "description": "Present when returned by upstream; shared among subscribers."
              "schema":
                "type": "string"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Invalid ID, query or header"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Not found or unsupported endpoint"
        "405":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Method not allowed; use GET or HEAD"
        "502":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Upstream refused the stream"
        "503":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "No healthy source could start the stream"
      "summary": "Stream a channel"
      "tags":
        - "Streaming"
    "head":
      "description": "Checks that the channel exists and that at least one source is eligible without allocating a tuner. Eligible means a healthy source outside its stream cooldown; when none exists, healthy sources whose whole backend is cooling down are also eligible. A service or channel cooldown from a tuner shortage is still respected. 200 does not guarantee tuner allocation or that a stream will start."
      "parameters":
        -
          "in": "path"
          "name": "type"
          "required": true
          "schema":
            "type": "string"
        -
          "in": "path"
          "name": "channel"
          "required": true
          "schema":
            "type": "string"
        -
          "description": "Validated for compatibility; HEAD allocates no tuner."
          "in": "query"
          "name": "decode"
          "schema":
            "enum":
              - "0"
              - "1"
            "type": "string"
        -
          "description": "Validated for compatibility; HEAD allocates no tuner."
          "in": "header"
          "name": "X-Mirakurun-Priority"
          "schema":
            "maximum": 2147483647
            "minimum": 0
            "type": "integer"
      "responses":
        "200":
          "description": "Headers only; no body"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Invalid ID, query or header"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Not found or unsupported endpoint"
        "503":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "No healthy source could start the stream"
      "summary": "Check channel stream eligibility (headers only)"
      "tags":
        - "Streaming"
