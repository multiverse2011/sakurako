"info":
  "description": "Read-only Mirakurun aggregation API. Catalog reads use synchronized snapshots. GET and HEAD are supported; other methods return 405. Unsupported endpoints return 404. Authentication, when required, is provided by the deployment proxy."
  "title": "Sakurako API"
  "version": "1.0.0"
"openapi": "3.0.3"
"paths":
  "/-/ui/state":
    "get":
      "description": "Sakurako-specific snapshot of backends, catalog and shared streams. Counters are process-local. Timestamps use RFC 3339; unset timestamps are null. Cache-Control: no-store."
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/UIState"
          "description": "Success"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Invalid ID, query or header"
        "405":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Method not allowed; use GET or HEAD"
      "summary": "Read UI snapshot"
      "tags":
        - "Monitoring"
    "head":
      "description": "Returns the same snapshot headers as GET without a body."
      "responses":
        "200":
          "description": "Headers only; no body"
        "400":
          "content":
            "application/json":
