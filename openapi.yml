  "/api/services/{id}/stream":
    "get":
      "description": "Continuous MPEG-TS. Matching service/domain/broadcast type requests share one upstream regardless of tuner priority; the connection keeps the allocation of the request that started it. A decode=0 request may join an existing decode=1 stream, never the reverse. Omitted decode is distinct from an explicit value; an omitted priority is not sent upstream. When choosing a source to start the stream, sources that are healthy and outside their stream cooldown are used; if there is no such source, sources that are healthy but cooling down as a whole backend are tried. A service cooldown from a tuner shortage is still respected. Source failover is attempted only before sending the first body byte. Slow subscribers may be disconnected independently."
      "parameters":
        -
          "description": "Mirakurun numeric identifier"
          "in": "path"
          "name": "id"
          "required": true
          "schema":
            "format": "int64"
            "type": "integer"
        -
          "description": "Forwarded to Mirakurun; one value only."
          "in": "query"
          "name": "decode"
          "schema":
            "enum":
              - "0"
              - "1"
            "type": "string"
        -
          "description": "Tuner allocation priority; distinct from backend source priority."
          "in": "header"
          "name": "X-Mirakurun-Priority"
          "schema":
            "maximum": 2147483647
            "minimum": 0
            "type": "integer"
      "responses":
        "200":
          "content":
            "video/MP2T":
              "schema":
                "format": "binary"
                "type": "string"
          "description": "Live transport stream; continues until disconnected."
          "headers":
            "X-Mirakurun-Tuner-User-ID":
              "description": "Present when returned by upstream; shared among subscribers."
              "schema":
                "type": "string"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Invalid ID, query or header"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Not found or unsupported endpoint"
        "405":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Method not allowed; use GET or HEAD"
        "409":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Service identity conflict"
        "502":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Upstream refused the stream"
        "503":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "No healthy source could start the stream"
      "summary": "Stream a service"
      "tags":
        - "Streaming"
    "head":
      "description": "Checks catalog membership and source eligibility without allocating a tuner. Eligible means a healthy source outside its stream cooldown; when none exists, healthy sources whose whole backend is cooling down are also eligible. A service cooldown from a tuner shortage is still respected. 200 does not guarantee tuner allocation or that a stream will start."
      "parameters":
        -
          "description": "Mirakurun numeric identifier"
          "in": "path"
          "name": "id"
          "required": true
          "schema":
            "format": "int64"
            "type": "integer"
        -
          "description": "Validated for compatibility; HEAD allocates no tuner."
          "in": "query"
          "name": "decode"
          "schema":
            "enum":
              - "0"
              - "1"
            "type": "string"
        -
          "description": "Validated for compatibility; HEAD allocates no tuner."
          "in": "header"
          "name": "X-Mirakurun-Priority"
          "schema":
            "maximum": 2147483647
            "minimum": 0
            "type": "integer"
      "responses":
        "200":
          "description": "Headers only; no body"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Invalid ID, query or header"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Not found or unsupported endpoint"
        "409":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "Service identity conflict"
        "503":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
          "description": "No healthy source could start the stream"
      "summary": "Check stream eligibility (headers only)"
      "tags":
        - "Streaming"
  "/api/tuners":
    "get":
      "description": "Live aggregated tuner state from every backend. Channel names in users' stream settings follow channel_names. With multiple backends, index values are scoped (10000 per backend) and names are prefixed with the backend ID. Backends that fail are omitted and logged; 503 only when every backend fails."
